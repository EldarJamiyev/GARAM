name: GARAM ZERO HOUR CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Static Analysis
        run: npm run typecheck

      - name: Vitest Deterministic Test Suite
        run: npm run test

      - name: Production Workspaces Build
        run: npm run build
