      <text x="234" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FF88">$700</text>
      <g transform="translate(10, 42)" font-family="'Inter', sans-serif" font-size="10.5" fill="rgba(255,255,255,0.72)">
        <text>Dmg: <tspan fill="#FF2A55" font-weight="700">53 / 212 HP</tspan> • <tspan fill="#FFF" font-weight="700">267 RPM</tspan></text>
