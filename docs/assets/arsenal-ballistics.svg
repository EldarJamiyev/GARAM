<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E131C"/>
      <stop offset="100%" stop-color="#080C11"/>
    </linearGradient>
    <pattern id="arsenal-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1100" height="500" rx="14" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect width="1100" height="500" rx="14" fill="url(#arsenal-grid)"/>

  <!-- Header -->
  <g transform="translate(40, 40)">
    <text font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      GARAM ARSENAL &amp; BALLISTICS TELEMETRY
    </text>
    <text y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#FFDF73" letter-spacing="1.5">
      9 COMPETITIVE CS2 WEAPONS • 5-ZONE HITBOXES • ZERO STANDING FIRST-SHOT SPREAD
    </text>
  </g>

  <!-- ROW 1: 5 PRIMARY & MELEE FLAGSHIPS -->
  <g transform="translate(40, 82)">
    <!-- Card 1: Garam-47 -->
    <g transform="translate(0, 0)">
      <rect width="192" height="148" rx="8" fill="rgba(20, 28, 40, 0.85)" stroke="rgba(212, 175, 55, 0.5)" stroke-width="1.2"/>
      <rect width="192" height="26" rx="8" fill="rgba(212, 175, 55, 0.15)"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FFDF73">GARAM-47</text>
      <text x="182" y="18" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FF88">$2,700</text>
      <g transform="translate(10, 44)" font-family="'Inter', sans-serif" font-size="10.5" fill="rgba(255,255,255,0.72)">
        <text>Slot 1 • <tspan fill="#FFF" font-weight="700">Assault Rifle</tspan></text>
        <text y="18">Damage: <tspan fill="#FF2A55" font-weight="700">36 / 144 HP</tspan></text>
        <text y="35">Rate / Mag: <tspan fill="#FFF" font-weight="700">600 RPM • 30 / 90</tspan></text>
        <text y="52">First Shot: <tspan fill="#00FF88" font-weight="800">Pinpoint 0.0 Spread</tspan></text>
        <text y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#D4AF37">CS2 '7' Recoil • 1-Tap HS</text>
      </g>
    </g>

    <!-- Card 2: Vanguard M4A1-S -->
    <g transform="translate(206, 0)">
      <rect width="192" height="148" rx="8" fill="rgba(20, 28, 40, 0.85)" stroke="rgba(0, 240, 255, 0.5)" stroke-width="1.2"/>
      <rect width="192" height="26" rx="8" fill="rgba(0, 240, 255, 0.15)"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00F0FF">M4A1-S</text>
      <text x="182" y="18" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FF88">$2,750</text>
      <g transform="translate(10, 44)" font-family="'Inter', sans-serif" font-size="10.5" fill="rgba(255,255,255,0.72)">
        <text>Slot 1 • <tspan fill="#FFF" font-weight="700">Suppressed Rifle</tspan></text>
        <text y="18">Damage: <tspan fill="#FF2A55" font-weight="700">33 / 132 HP</tspan></text>
        <text y="35">Rate / Mag: <tspan fill="#FFF" font-weight="700">666 RPM • 25 / 75</tspan></text>
        <text y="52">Acoustics: <tspan fill="#00FF88" font-weight="800">24m Muffled</tspan></text>
        <text y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00F0FF">Laser Spray Grouping</text>
      </g>
    </g>

    <!-- Card 3: M4A4 -->
    <g transform="translate(412, 0)">
      <rect width="192" height="148" rx="8" fill="rgba(20, 28, 40, 0.85)" stroke="rgba(59, 158, 255, 0.55)" stroke-width="1.2"/>
      <rect width="192" height="26" rx="8" fill="rgba(59, 158, 255, 0.16)"/>
