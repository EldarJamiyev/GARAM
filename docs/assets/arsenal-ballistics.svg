      <g transform="translate(10, 42)" font-family="'Inter', sans-serif" font-size="10.5" fill="rgba(255,255,255,0.72)">
        <text>Dmg: <tspan fill="#FF2A55" font-weight="700">26 / 104 HP</tspan> • <tspan fill="#FFF" font-weight="700">857 RPM</tspan></text>
        <text y="18">Mag: <tspan fill="#FFF" font-weight="700">30 / 120</tspan> • Kill: <tspan fill="#00FF88" font-weight="700">$600</tspan></text>
        <text y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#C084FC">Micro Optic + Vertical Foregrip</text>
      </g>
    </g>

    <!-- Desert Eagle -->
    <g transform="translate(258, 0)">
      <rect width="244" height="114" rx="8" fill="rgba(20, 28, 40, 0.85)" stroke="rgba(255, 42, 85, 0.5)" stroke-width="1.2"/>
