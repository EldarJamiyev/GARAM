        <text y="18">Damage: <tspan fill="#FF2A55" font-weight="700">33 / 132 HP</tspan></text>
        <text y="35">Rate / Mag: <tspan fill="#FFF" font-weight="700">666 RPM • 30 / 90</tspan></text>
        <text y="52">Silhouette: <tspan fill="#00FF88" font-weight="800">Quad-Rail RIS</tspan></text>
        <text y="72" font-family="'JetBrains Mono', monospace" font-size="9" fill="#60A5FA">Sustained Multi-Spray Hold</text>
