      <text x="182" y="18" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FF88">$3,100</text>
      <g transform="translate(10, 44)" font-family="'Inter', sans-serif" font-size="10.5" fill="rgba(255,255,255,0.72)">
