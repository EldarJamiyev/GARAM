      <g transform="translate(10, 42)" font-family="'Inter', sans-serif" font-size="10.5" fill="rgba(255,255,255,0.72)">
        <text>Dmg: <tspan fill="#FF2A55" font-weight="700">35 / 140 HP</tspan> • <tspan fill="#FFF" font-weight="700">352 RPM</tspan></text>
        <text y="18">Mag: <tspan fill="#FFF" font-weight="700">12 / 24</tspan> • <tspan fill="#00FF88" font-weight="700">Vanguard Starter</tspan></text>
        <text y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00F0FF">Baffled Suppressor + 3-Dot Sights</text>
      </g>
    </g>

    <!-- Glock-18 -->
    <g transform="translate(774, 0)">
      <rect width="246" height="114" rx="8" fill="rgba(20, 28, 40, 0.85)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.2"/>
      <rect width="246" height="24" rx="8" fill="rgba(245, 158, 11, 0.16)"/>
      <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FBBF24">GLOCK-18 (9MM)</text>
      <text x="236" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FF88">$200</text>
      <g transform="translate(10, 42)" font-family="'Inter', sans-serif" font-size="10.5" fill="rgba(255,255,255,0.72)">
        <text>Dmg: <tspan fill="#FF2A55" font-weight="700">30 / 120 HP</tspan> • <tspan fill="#FFF" font-weight="700">400 RPM</tspan></text>
        <text y="18">Mag: <tspan fill="#FFF" font-weight="700">20 / 120</tspan> • <tspan fill="#00FF88" font-weight="700">Syndicate Starter</tspan></text>
        <text y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FBBF24">Machined Slide + High-Cap Mag</text>
      </g>
    </g>
