    </g>

    <!-- USP-S -->
    <g transform="translate(516, 0)">
      <rect width="244" height="114" rx="8" fill="rgba(20, 28, 40, 0.85)" stroke="rgba(0, 240, 255, 0.5)" stroke-width="1.2"/>
      <rect width="244" height="24" rx="8" fill="rgba(0, 240, 255, 0.15)"/>
      <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00F0FF">USP-S (SILENCED)</text>
