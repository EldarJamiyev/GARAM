      <stop offset="0%" stop-color="#0E131B"/>
      <stop offset="100%" stop-color="#080C11"/>
    </linearGradient>
    <linearGradient id="shared-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>
    <linearGradient id="client-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00AA55"/>
