      <text y="116" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Sub-tick Spherical Lerp Interpolation</text>
      <text y="132" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Anti-Peekers Advantage Rewind</text>

      <text y="164" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Competitive Networking</text>
      <text y="182" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Binary / Compact JSON Packets</text>
      <text y="198" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Client Prediction Reconciliation</text>
      <text y="214" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Server-Side Ballistics Validation</text>

      <text y="246" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Deployment Ready</text>
      <text y="264" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255, 42, 85, 0.85)">• Headless Node.js Worker</text>
      <text y="280" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255, 42, 85, 0.85)">• Zero Browser / DOM Overhead</text>
