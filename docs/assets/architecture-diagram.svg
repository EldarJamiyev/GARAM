      <text y="18" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Dual-Pass Viewmodel (65° FOV, No Clipping)</text>
      <text y="34" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• PMREM IBL PBR Metallic Sheen</text>
      <text y="50" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Mesh Pooling (Decals, Tracers, Smoke)</text>

