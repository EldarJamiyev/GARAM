      <text y="280" font-family="'Inter', sans-serif" font-size="11" fill="rgba(0, 255, 136, 0.85)">• main.ts &lt;= 650 Lines Orchestrator</text>
      <text y="296" font-family="'Inter', sans-serif" font-size="11" fill="rgba(0, 255, 136, 0.85)">• Single-Responsibility Subsystems</text>
