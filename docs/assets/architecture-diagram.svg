      <text y="18" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• 15.625ms Tick Frequency</text>
      <text y="34" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Authoritative Kinematics Verification</text>
      <text y="50" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Match Round State Machine</text>

