      <text y="164" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">A* Tactical NavGraph</text>
      <text y="182" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• 32 Bidirectional Waypoints (DE_CITADEL)</text>
      <text y="198" font-family="'Inter', sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">• Dynamic Edge Danger Weighting</text>
