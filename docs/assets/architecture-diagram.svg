  <polygon points="395,200 387,196 387,204" fill="#00F0FF"/>

  <!-- Server to Shared -->
  <path d="M 750 200 L 705 200" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4, 3"/>
  <polygon points="705,200 713,196 713,204" fill="#00F0FF"/>

  <!-- Network Interconnect (Bottom) -->
  <g transform="translate(200, 492)">
    <line x1="0" y1="0" x2="700" y2="0" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="6, 6"/>
    <text x="350" y="-8" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
      &lt;== WEBSOCKET RPC // 64-TICK STATE SYNC // CLIENT-SIDE INPUT PREDICTION ==&gt;
