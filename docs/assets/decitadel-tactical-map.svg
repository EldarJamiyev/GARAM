<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <linearGradient id="map-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="100%" stop-color="#0E131C"/>
    </linearGradient>
    <pattern id="tactical-blueprint-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 240, 255, 0.045)" stroke-width="0.8"/>
    </pattern>
    <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1.1"/>
    </pattern>
  </defs>

  <!-- Background Blueprint Card -->
  <rect width="1100" height="620" rx="14" fill="url(#map-bg)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5"/>
  <rect width="1100" height="620" rx="14" fill="url(#tactical-blueprint-grid)"/>
  <rect width="1100" height="620" rx="14" fill="url(#major-grid)"/>

  <!-- Header Bar -->
  <g transform="translate(44, 44)">
