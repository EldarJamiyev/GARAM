<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C11"/>
      <stop offset="50%" stop-color="#0F1622"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2F1FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="crimson-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#FF6B8B"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFDF73"/>
    </linearGradient>
    <pattern id="tactical-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1"/>
      <circle cx="40" cy="0" r="1.5" fill="rgba(0, 240, 255, 0.15)"/>
    </pattern>
    <pattern id="dot-matrix" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.03)"/>
    </pattern>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="rgba(0, 240, 255, 0.22)" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="16" fill="url(#tactical-grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#dot-matrix)"/>

  <!-- Tactical Radar Corner Markers -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 1176 44 L 1176 24 L 1156 24" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 24 276 L 24 296 L 44 296" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 1176 276 L 1176 296 L 1156 296" fill="none" stroke="#00F0FF" stroke-width="2.5"/>

  <!-- Radar Scope Accent on Right -->
  <g transform="translate(1010, 160)" opacity="0.6">
    <circle r="110" fill="none" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1"/>
    <circle r="75" fill="none" stroke="rgba(0, 240, 255, 0.18)" stroke-width="1.2" stroke-dasharray="4, 6"/>
    <circle r="40" fill="none" stroke="rgba(0, 240, 255, 0.28)" stroke-width="1"/>
    <circle r="4" fill="#00F0FF"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1"/>
    <line x1="0" y1="0" x2="65" y2="-65" stroke="#FF2A55" stroke-width="2" filter="url(#glow-crimson)"/>
    <circle cx="65" cy="-65" r="4.5" fill="#FF2A55"/>
    <text x="75" y="-60" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FF2A55" letter-spacing="1">HOSTILE [A_LONG]</text>
  </g>

  <!-- Tactical Header Status Bar -->
  <g transform="translate(60, 48)">
    <rect width="180" height="22" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
    <circle cx="12" cy="11" r="4" fill="#00FF88"/>
    <text x="24" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#00F0FF" letter-spacing="2">TACTICAL KERNEL v0.3.0</text>
    
    <text x="210" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="rgba(255, 255, 255, 0.45)" letter-spacing="1.5">LOCATION: DE_CITADEL // 128Hz TICKLESS CLIENT</text>
  </g>

  <!-- Main Hero Brand Headline -->
  <g transform="translate(60, 135)">
    <text font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#title-grad)" letter-spacing="4">
      GARAM<tspan fill="#FF2A55">:</tspan> <tspan fill="#FFFFFF">ZERO HOUR</tspan>
    </text>
    <text y="38" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="600" fill="rgba(200, 220, 245, 0.85)" letter-spacing="1.5">
      Competitive Browser-Native 5v5 Tactical FPS • CS2 Precision • WebGL2 / WebGPU
    </text>
  </g>

  <!-- Feature Badge Strip -->
  <g transform="translate(60, 225)">
    <!-- Badge 1: 128Hz Fixed Kinematics -->
    <g transform="translate(0, 0)">
      <rect width="168" height="38" rx="6" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1"/>
      <circle cx="16" cy="19" r="4" fill="#00F0FF"/>
      <text x="28" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#E2F1FF" letter-spacing="0.8">128Hz Kinematics</text>
    </g>

    <!-- Badge 2: SAT Wall Deflection -->
    <g transform="translate(180, 0)">
      <rect width="176" height="38" rx="6" fill="rgba(255, 42, 85, 0.08)" stroke="rgba(255, 42, 85, 0.35)" stroke-width="1"/>
      <circle cx="16" cy="19" r="4" fill="#FF2A55"/>
      <text x="28" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFE2E8" letter-spacing="0.8">Circle-AABB SAT</text>
    </g>

    <!-- Badge 3: A* Bot Brain -->
    <g transform="translate(368, 0)">
      <rect width="164" height="38" rx="6" fill="rgba(0, 255, 136, 0.08)" stroke="rgba(0, 255, 136, 0.35)" stroke-width="1"/>
      <circle cx="16" cy="19" r="4" fill="#00FF88"/>
      <text x="28" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#E2FFE8" letter-spacing="0.8">A* Tactical Brain</text>
    </g>

    <!-- Badge 4: True Hawkbill Karambit -->
    <g transform="translate(544, 0)">
      <rect width="180" height="38" rx="6" fill="rgba(212, 175, 55, 0.08)" stroke="rgba(212, 175, 55, 0.45)" stroke-width="1"/>
      <circle cx="16" cy="19" r="4" fill="#D4AF37"/>
      <text x="28" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFF4D0" letter-spacing="0.8">Crimson Karambit</text>
    </g>

    <!-- Badge 5: 64-Tick Rewind -->
    <g transform="translate(736, 0)">
      <rect width="168" height="38" rx="6" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
      <circle cx="16" cy="19" r="4" fill="#A855F7"/>
      <text x="28" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F3E8FF" letter-spacing="0.8">64-Tick Rewind</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <line x1="0" y1="318" x2="1200" y2="318" stroke="url(#title-grad)" stroke-width="2"/>
</svg>