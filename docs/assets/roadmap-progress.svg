<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <linearGradient id="roadmap-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E131C"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <pattern id="road-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1100" height="320" rx="14" fill="url(#roadmap-bg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect width="1100" height="320" rx="14" fill="url(#road-grid)"/>

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      GARAM: ZERO HOUR — DEVELOPMENT ROADMAP &amp; MILESTONE PROGRESS
    </text>
    <text y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00FF88" letter-spacing="1.5">
      SOURCE 2 CS2 POLISH COMPLETE • 168/168 TESTS PASSING (20 SUITES) • PBR IBL, CS2 HUD &amp; HARD ROUND RESET
    </text>
  </g>

  <!-- Horizontal Milestone Tracker -->
  <g transform="translate(40, 115)">
    <line x1="60" y1="50" x2="940" y2="50" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>
    <line x1="60" y1="50" x2="940" y2="50" stroke="#00FF88" stroke-width="4"/>

    <!-- MILESTONE 1: Phases 1-4 -->
    <g transform="translate(60, 50)">
      <circle r="14" fill="#00FF88"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#080C11">✓</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00FF88">PHASE 1–4</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">Core FPS Kernel</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">128Hz SAT, 5-Zone Hitboxes</text>
    </g>

    <!-- MILESTONE 2: Dual-Pass PBR & 9-Weapon Arsenal -->
    <g transform="translate(280, 50)">
      <circle r="14" fill="#00FF88"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#080C11">✓</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00FF88">SPRINT E1–E4</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">9-Weapon Viewmodels</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">PMREM IBL, Faction Gloves, [Q]</text>
    </g>

    <!-- MILESTONE 3: Anti-Prefire AI & 3P Operator IK -->
    <g transform="translate(500, 50)">
      <circle r="14" fill="#00FF88"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#080C11">✓</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00FF88">SPRINT E5–E7</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">Anti-Prefire AI &amp; 3P IK</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">A* NavGraph, Baked Radar, Smoke LOS</text>
    </g>

    <!-- MILESTONE 4: 64-Tick Network & MapRegistry -->
    <g transform="translate(720, 50)">
      <circle r="14" fill="#00FF88"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#080C11">✓</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00FF88">NETCODE + MAPS</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">64-Tick &amp; MapRegistry</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#00FF88">DE_DUST2 + CS_OFFICE Sync</text>
    </g>

    <!-- MILESTONE 5: Physical Grips, Smooth Steps & Zero-Overlap Polish -->
    <g transform="translate(940, 50)">
      <circle r="14" fill="#00FF88"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#080C11">✓</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00FF88">SOURCE 2 CS2</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">CS2 PBR &amp; HUD</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#00FF88">IBL, Kill Cards, Hard Reset</text>
    </g>
  </g>

  <!-- Footer Stats Bar -->
  <g transform="translate(40, 260)">
    <rect width="1020" height="38" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.7)">
      SERVER: <tspan fill="#00FF88" font-weight="700">64Hz Rewind</tspan>  |  KINEMATICS: <tspan fill="#00FF88" font-weight="700">128Hz Smooth Step</tspan>  |  ARENAS: <tspan fill="#00FF88" font-weight="700">Dust 2 + Office</tspan>  |  ARSENAL: <tspan fill="#00FF88" font-weight="700">9 Weapons</tspan>  |  TESTS: <tspan fill="#00FF88" font-weight="700">168/168 PASSING</tspan>
    </text>
  </g>
</svg>
