<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <linearGradient id="roadmap-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E131C"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <pattern id="road-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1100" height="320" rx="14" fill="url(#roadmap-bg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect width="1100" height="320" rx="14" fill="url(#road-grid)"/>

  <!-- Header -->
  <g transform="translate(40, 42)">
    <text font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      GARAM: ZERO HOUR — DEVELOPMENT ROADMAP &amp; MILESTONE PROGRESS
    </text>
    <text y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00FF88" letter-spacing="1.5">
      CHECKPOINT 3: SPRINTS E1–E7 COMPLETE • 40 PASSING TESTS • PRODUCTION-READY FPS KERNEL
    </text>
  </g>

  <!-- Horizontal Milestone Tracker -->
  <g transform="translate(40, 115)">
    <!-- Milestone Progress Track Line -->
    <line x1="60" y1="50" x2="960" y2="50" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>
    <line x1="60" y1="50" x2="720" y2="50" stroke="#00FF88" stroke-width="4"/>

    <!-- MILESTONE 1: Phases 1-4 (Foundations) -->
    <g transform="translate(60, 50)">
      <circle r="14" fill="#00FF88"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#080C11">✓</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00FF88">PHASE 1–4</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">Core FPS Kernel</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">128Hz, SAT Physics, De_Citadel</text>
    </g>

    <!-- MILESTONE 2: Sprints E1-E4 (Elite Fundamentals) -->
    <g transform="translate(280, 50)">
      <circle r="14" fill="#00FF88"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#080C11">✓</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00FF88">SPRINT E1–E4</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">Visuals &amp; Gunplay</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">sRGB, Shadows, [Q] Fast Switch</text>
    </g>

    <!-- MILESTONE 3: Sprints E5-E7 (Checkpoint 3 - CURRENT) -->
    <g transform="translate(500, 50)">
      <circle r="16" fill="#00F0FF" stroke="#FFFFFF" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#080C11">★</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00F0FF">SPRINT E5–E7</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">Tactical Brain &amp; Polish</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#00F0FF">A* NavGraph, Karambit, Spectator</text>
    </g>

    <!-- MILESTONE 4: 64-Tick Dedicated Matchmaking -->
    <g transform="translate(720, 50)">
      <circle r="14" fill="#1C2634" stroke="#D4AF37" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FFDF73">4</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FFDF73">PHASE 5</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFF">Multiplayer Rollout</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Dedicated 64-Tick Rooms</text>
    </g>

    <!-- MILESTONE 5: Ranked Matchmaking & Community Maps -->
    <g transform="translate(940, 50)">
      <circle r="14" fill="#141B24" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="rgba(255,255,255,0.4)">5</text>
      <text y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="rgba(255,255,255,0.4)">PHASE 6</text>
      <text y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.6)">Ranked &amp; Workshop</text>
      <text y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">ELO Ladder &amp; Custom Maps</text>
    </g>
  </g>

  <!-- Bottom Milestone Summary Bar -->
  <g transform="translate(40, 248)">
    <rect width="1020" height="42" rx="6" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1"/>
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FF88">CURRENT STATUS:</text>
    <text x="140" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">
      Checkpoint 3 Complete • 40 Unit Tests Passing • Zero TS Errors • Shipped Live to GitHub
    </text>
    <rect x="910" y="8" width="90" height="26" rx="4" fill="rgba(0, 255, 136, 0.2)" stroke="#00FF88" stroke-width="1"/>
    <text x="955" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#00FF88">VERIFIED</text>
  </g>
</svg>